name: Publish To npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo 'Select an existing vMAJOR.MINOR.PATCH tag when dispatching this workflow.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release/check-release-tag.mjs "$GITHUB_REF_NAME"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm 11.5.1 or later is required for trusted publishing");' "$(npm --version)"

      - name: Set up Corepack
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          corepack install
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/corepack/yarn" --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify package
        run: |
          yarn release:check
          yarn dependencies:check
          yarn audit
          yarn lint
          yarn tsc:full
          yarn test:coverage
          yarn build
          yarn publint

      - name: Pack Backstage package
        run: yarn pack --out "$RUNNER_TEMP/webex-package.tgz"

      - name: Publish package with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/webex-package.tgz" --access public --provenance --ignore-scripts
