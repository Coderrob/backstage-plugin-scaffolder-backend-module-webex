name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (revision means patch)
        required: true
        default: revision
        type: choice
        options:
          - revision
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Corepack
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          corepack install
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/corepack/yarn" --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare version and changelog
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          case "$RELEASE_BUMP" in
            major|minor) npm version "$RELEASE_BUMP" --no-git-tag-version --ignore-scripts --package-lock=false ;;
            revision) npm version patch --no-git-tag-version --ignore-scripts --package-lock=false ;;
            *) echo "Unsupported version increment: $RELEASE_BUMP" >&2; exit 1 ;;
          esac
          version="$(node -p 'require("./package.json").version')"
          node scripts/release/update-release-changelog.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release candidate
        run: |
          yarn install --immutable
          yarn release:check
          yarn audit
          yarn lint
          yarn tsc:full
          yarn test:coverage
          yarn build
          yarn publint

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="release/v${VERSION}"
          open_prs="$(gh pr list --base main --head "$branch" --state open --json number --jq 'length')"
          if [[ "$open_prs" != '0' ]]; then
            echo "An open pull request already exists for $branch" >&2
            exit 1
          fi
          git switch -c "$branch"
          git add package.json CHANGELOG.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: prepare v${VERSION} release"
          git push origin "$branch"
          printf 'Bump the package to v%s and move the Unreleased notes into a dated release section.\n\nValidation: release checks, audit, lint, types, coverage, build, and Publint passed.\n\nAfter merging, create and push tag v%s at the merged commit to publish to npm.\n' "$VERSION" "$VERSION" > "$RUNNER_TEMP/release-pr-body.md"
          gh pr create --base main --head "$branch" --title "Prepare v${VERSION} release" --body-file "$RUNNER_TEMP/release-pr-body.md"
