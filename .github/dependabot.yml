version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    # Security updates are grouped separately and are not subject to cooldown.
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    cooldown:
      default-days: 12
      include:
        - '*'

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    cooldown:
      default-days: 12
      include:
        - '*'
