version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 12
      include:
        - '*'

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 12
      include:
        - '*'
